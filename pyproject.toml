[project]
name = "homework-02-asyncio"
version = "0.1.0"
description = "ДЗ 2: asyncio, потоки и LRU-кеш"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "hw2/01_async_prices",
    "hw2/02_find_blocking",
    "hw2/03_thread_safe_lru",
]
norecursedirs = ["04_mini_event_loop"]
pythonpath = [
    "hw2/01_async_prices",
    "hw2/02_find_blocking",
    "hw2/03_thread_safe_lru",
]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["prices", "notifications", "thread_safe_lru"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["test_*.py", "README.md", "hw2/04_mini_event_loop"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "hw2/01_async_prices/prices.py",
    "hw2/02_find_blocking/notifications.py",
    "hw2/03_thread_safe_lru/thread_safe_lru.py",
]
