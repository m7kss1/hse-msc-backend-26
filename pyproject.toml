[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "homework-01-moderation"
version = "0.1.0"
description = "ДЗ 1: сервис модерации объявлений на FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moderation"]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --cov=moderation --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["moderation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["^\\s*\\.\\.\\.$"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "main.py", "tests"]
